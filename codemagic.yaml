# Codemagic configuration file for UK National Lost-Item application
# Documentation: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Flutter lint check
        script: flutter analyze
      - name: Build Android Debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install Pods
        script: |
          cd ios
          pod install
      - name: Build iOS App (Simulator)
        script: |
          flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app
